<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" role="img" aria-label="Sunset hospice care logo">
  <title>Sunset</title>
  <defs>
    <linearGradient id="sunsetGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <path d="M 30 110 A 70 70 0 0 1 170 110"
        stroke="url(#sunsetGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 50 110 A 50 50 0 0 1 150 110"
        stroke="url(#sunsetGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 70 110 A 30 30 0 0 1 130 110"
        stroke="url(#sunsetGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>

  <path d="M 100 78
           C 95 70, 82 70, 82 80
           C 82 90, 100 102, 100 102
           C 100 102, 118 90, 118 80
           C 118 70, 105 70, 100 78 Z"
        fill="url(#sunsetGrad)"/>

  <line x1="15" y1="115" x2="185" y2="115"
        stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
</svg>
